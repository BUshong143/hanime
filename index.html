<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anime Player with API</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }
  #player {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 9999;
  }
  #player.open {
    display: flex;
  }
  #ptitle {
    color: #fff;
    font-size: 1.2em;
    margin: 10px;
  }
  #stabs {
    display: flex;
    gap: 5px;
    margin-bottom: 10px;
  }
  .s-tab {
    padding: 8px 12px;
    background: #444;
    color: #fff;
    border: none;
    cursor: pointer;
  }
  .s-tab.active {
    background: #f39c12;
  }
  #videoFrame {
    width: 80%;
    height: 60%;
  }
  #closeBtn {
    background: red;
    color: #fff;
    border: none;
    padding: 8px 12px;
    cursor: pointer;
    margin-top: 10px;
  }
  /* Example styling for anime cards */
  .anime-card {
    padding: 10px;
    margin: 10px;
    background: #eee;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>Anime List</h1>
<div id="animeList">
  <!-- Example anime card -->
  <div class="anime-card" onclick="openAnimeModal(12345, 'Sample Anime')">
    Sample Anime Title
  </div>
</div>

<!-- Modal actions -->
<div id="macts"></div>

<!-- Player overlay -->
<div id="player">
  <div style="background:#222; padding:20px; border-radius:8px; display:flex; flex-direction:column; align-items:center;">
    <div id="ptitle"></div>
    <div id="stabs"></div>
    <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
    <button id="closeBtn" onclick="closeM()">Close</button>
  </div>
</div>

<script>
  let pId = null;
  let pType = null;
  let pTitle = '';
  let currentSources = [];

  // Placeholder for your real API fetch function
  async function fetchAnimeSources(malId) {
    // Example: Replace this with your real API call
    // For demonstration, returning mocked data
    return [
      { n: 'AniWatch', u: `https://aniwatch.to/embed/${malId}` },
      { n: 'Zoro', u: `https://zoro.to/embed/${malId}` },
      { n: 'AnimePahe', u: `https://animepahe.ru/play/${malId}` },
      { n: 'GogoAnime', u: `https://gogoanime3.co/${malId}` }
    ];
  }

  // Function to get sources for movies or shows (static fallback)
  function getSrc(id, type) {
    return [
      { n: 'Source 1', u: 'https://example.com/video1' },
      { n: 'Source 2', u: 'https://example.com/video2' }
    ];
  }

  // 1. Launch function
  async function launch(id, type, rawTitle) {
    pId = id;
    pType = type;
    pTitle = typeof rawTitle === 'string' ? decodeURIComponent(rawTitle) : String(rawTitle);

    // Fetch sources
    if (type === 'anime') {
      currentSources = await fetchAnimeSources(id);
    } else {
      currentSources = getSrc(id, type);
    }

    // Update UI
    document.getElementById('ptitle').textContent = '▶  ' + pTitle;
    document.getElementById('stabs').innerHTML = currentSources.map((s, i) =>
      `<button class="s-tab ${i === 0 ? 'active' : ''}" onclick="loadSrc(${i})">${s.n}</button>`
    ).join('');

    // Show player
    document.getElementById('player').classList.add('open');
    document.body.style.overflow = 'hidden';

    // Load first source
    loadSrc(0);
  }

  // 2. Load source
  function loadSrc(index) {
    const src = currentSources[index];

    document.getElementById('videoFrame').src = src.u;

    // Highlight active tab
    document.querySelectorAll('.s-tab').forEach((btn, i) => {
      btn.classList.toggle('active', i === index);
    });
  }

  // 3. Show modal with "Watch Now" button
  function openAnimeModal(malId, title) {
    document.getElementById('macts').innerHTML = `
      <button class="btn-w" onclick="closeM();launch(${malId},'anime','${encodeURIComponent(title)}')">
        ▶ Watch Now
      </button>
      <button class="btn-m" onclick="toast('Added to watchlist ✅')">
        + Watchlist
      </button>
    `;
  }

  // 4. Close player modal
  function closeM() {
    document.getElementById('player').classList.remove('open');
    document.body.style.overflow = '';
    document.getElementById('videoFrame').src = '';
  }

  // Dummy toast function
  function toast(msg) {
    alert(msg);
  }
</script>

</body>
</html>
